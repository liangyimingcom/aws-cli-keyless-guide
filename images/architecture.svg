<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="650" viewBox="0 0 1220 650" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E7157B"/></marker>
  </defs>
  <rect width="1220" height="650" fill="#ffffff"/>
  <text x="610" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#232F3E">运维工作站：从长期访问密钥到临时凭证（路径 B：IAM Identity Center）</text>
  <text x="610" y="60" text-anchor="middle" font-size="12" fill="#545B64">路径 A（aws login）流程类似：令牌缓存在 ~/.aws/login/cache，同样必须手动删除 credentials 中的同名静态段；中国区域目前只能用路径 B</text>

  <!-- workstation -->
  <rect x="20" y="80" width="360" height="480" rx="10" fill="#F2F3F3" stroke="#545B64" stroke-width="1.5"/>
  <text x="200" y="107" text-anchor="middle" font-size="16" font-weight="bold" fill="#232F3E">运维工作站（macOS / Linux）</text>

  <rect x="40" y="122" width="320" height="72" rx="6" fill="#ffffff" stroke="#879196"/>
  <text x="200" y="150" text-anchor="middle" font-size="13" fill="#232F3E">AWS CLI v2 / SDK / Terraform / CDK</text>
  <text x="200" y="175" text-anchor="middle" font-size="12" fill="#545B64">IDE 插件、AI 编码助手等本机工具</text>

  <rect x="40" y="206" width="320" height="84" rx="6" fill="#ffffff" stroke="#1D8102" stroke-width="1.5"/>
  <text x="200" y="230" text-anchor="middle" font-size="14" fill="#1D8102" font-weight="bold">~/.aws/config</text>
  <text x="200" y="252" text-anchor="middle" font-size="12" fill="#232F3E">[sso-session] + [profile prod] …</text>
  <text x="200" y="273" text-anchor="middle" font-size="12" fill="#232F3E">向导自动写入，profile 名称保持不变</text>

  <rect x="40" y="302" width="320" height="104" rx="6" fill="#FFF8EC" stroke="#FF9900" stroke-width="1.5"/>
  <text x="200" y="326" text-anchor="middle" font-size="14" fill="#B35C00" font-weight="bold">本机会话缓存（有时效，明文）</text>
  <text x="200" y="348" text-anchor="middle" font-size="12" fill="#232F3E">~/.aws/sso/cache · ~/.aws/cli/cache</text>
  <text x="200" y="369" text-anchor="middle" font-size="12" fill="#232F3E">访问令牌、刷新令牌与临时凭证，自动过期</text>
  <text x="200" y="390" text-anchor="middle" font-size="12" fill="#545B64">建议：会话时长不要过长 + 开启磁盘加密</text>

  <rect x="40" y="418" width="320" height="124" rx="6" fill="#ffffff" stroke="#D13212" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="200" y="443" text-anchor="middle" font-size="14" fill="#D13212" font-weight="bold">~/.aws/credentials</text>
  <text x="200" y="466" text-anchor="middle" font-size="12" fill="#D13212">迁移前：长期密钥 AKIA…（不过期）</text>
  <text x="200" y="488" text-anchor="middle" font-size="12" fill="#1D8102">迁移后：同名静态段已手动删除</text>
  <text x="200" y="510" text-anchor="middle" font-size="12" fill="#545B64">aws login / aws sso login 都不会改动此文件</text>
  <text x="200" y="531" text-anchor="middle" font-size="12" fill="#545B64">静态段残留时，CLI 可能仍在用旧密钥</text>

  <!-- identity center -->
  <rect x="500" y="130" width="290" height="320" rx="10" fill="#FFF4E5" stroke="#FF9900" stroke-width="2"/>
  <text x="645" y="161" text-anchor="middle" font-size="17" font-weight="bold" fill="#232F3E">AWS IAM Identity Center</text>
  <g font-size="13" fill="#232F3E">
    <text x="520" y="194">• 统一的工作人员身份 + MFA</text>
    <text x="520" y="221">• 账号与权限集由管理员分配</text>
    <text x="520" y="248">• 权限集会话：每份凭证 1–12 小时</text>
    <text x="520" y="275">• 用户会话：决定多久重新登录</text>
    <text x="520" y="302">• 一处停用，所有账号收回</text>
    <text x="520" y="329">• 设备丢失：管理员结束活动会话</text>
  </g>
  <text x="645" y="384" text-anchor="middle" font-size="12" fill="#545B64">全球区域与中国区域各自独立部署</text>
  <text x="645" y="406" text-anchor="middle" font-size="12" fill="#545B64">每个实例对应本机一个 sso-session</text>

  <!-- accounts -->
  <rect x="890" y="90" width="310" height="310" rx="10" fill="#F2F8FD" stroke="#147EBA" stroke-width="1.5"/>
  <text x="1045" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="#232F3E">AWS 账号</text>
  <rect x="910" y="138" width="270" height="66" rx="6" fill="#ffffff" stroke="#147EBA"/>
  <text x="1045" y="164" text-anchor="middle" font-size="13" fill="#232F3E">生产账号</text>
  <text x="1045" y="186" text-anchor="middle" font-size="11" fill="#545B64">AWSReservedSSO_&lt;权限集&gt;_* 角色</text>
  <rect x="910" y="220" width="270" height="66" rx="6" fill="#ffffff" stroke="#147EBA"/>
  <text x="1045" y="246" text-anchor="middle" font-size="13" fill="#232F3E">测试 / 开发账号</text>
  <text x="1045" y="268" text-anchor="middle" font-size="11" fill="#545B64">同一 sso-session，共享一次登录</text>
  <rect x="910" y="302" width="270" height="66" rx="6" fill="#ffffff" stroke="#147EBA"/>
  <text x="1045" y="328" text-anchor="middle" font-size="13" fill="#232F3E">中国区域账号</text>
  <text x="1045" y="350" text-anchor="middle" font-size="11" fill="#545B64">独立的 Identity Center（awsapps.cn）</text>

  <!-- arrows -->
  <line x1="362" y1="160" x2="497" y2="196" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/>
  <text x="392" y="96" font-size="11.5" fill="#232F3E">① aws configure sso</text>
  <text x="406" y="112" font-size="11.5" fill="#232F3E">或 aws sso login</text>
  <text x="406" y="128" font-size="11.5" fill="#545B64">（浏览器 + MFA）</text>
  <line x1="497" y1="318" x2="363" y2="348" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/>
  <text x="404" y="312" font-size="12" fill="#232F3E">② 访问令牌</text>
  <line x1="792" y1="232" x2="906" y2="196" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/>
  <text x="800" y="186" font-size="12" fill="#232F3E">③ 签发角色凭证</text>
  <path d="M362,390 C480,600 770,600 907,345" fill="none" stroke="#E7157B" stroke-width="2.2" marker-end="url(#o)"/>
  <text x="640" y="582" text-anchor="middle" font-size="13" fill="#E7157B" font-weight="bold">④ 使用临时凭证（ASIA…，到期自动失效）调用 AWS API</text>

  <text x="610" y="626" text-anchor="middle" font-size="13" fill="#545B64">旧长期密钥在 IAM 中先停用、确认“最近使用时间”无异常后再删除；本机只保留有时效的会话缓存，不再有永不过期的密钥</text>
</svg>
